version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: voice-agent-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=voice_agent_db
    networks:
      - voice-agent-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: voice-agent-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - voice-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fastify API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent-api
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src:ro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=voice_agent_db
      - CHROMADB_URL=http://chromadb:8000
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - voice-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  voice-agent-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  chromadb_data:
    driver: local
